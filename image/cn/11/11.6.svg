<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440">
  <!-- 背景网格 -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#eee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#grid)" />
  
  <!-- 标题 -->
  <text x="300" y="30" font-family="Arial, SimHei" font-size="18" text-anchor="middle" font-weight="bold">双阈值处理示意图</text>
  
  <!-- 左侧：细边缘图 -->
  <g transform="translate(50, 50)">
    <rect width="200" height="200" fill="#fff" stroke="#333" />
    
    <!-- 模拟图像内容 - 边缘线 -->
    <path d="M 40,40 L 160,40 L 160,160 L 40,160 Z" fill="none" stroke="#555" stroke-width="2" />
    
    <!-- 一些不同强度的边缘 -->
    <line x1="60" y1="60" x2="140" y2="60" stroke="#222" stroke-width="2" />
    <line x1="60" y1="80" x2="140" y2="80" stroke="#666" stroke-width="2" />
    <line x1="60" y1="100" x2="140" y2="100" stroke="#999" stroke-width="2" />
    <line x1="60" y1="120" x2="140" y2="120" stroke="#bbb" stroke-width="2" />
    
    <text x="100" y="230" font-family="Arial, SimHei" font-size="16" text-anchor="middle">不同强度的边缘</text>
  </g>
  
  <!-- 右侧：双阈值处理后 -->
  <g transform="translate(350, 50)">
    <rect width="200" height="200" fill="#fff" stroke="#333" />
    
    <!-- 模拟图像内容 - 分类后的边缘 -->
    <path d="M 40,40 L 160,40 L 160,160 L 40,160 Z" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,3" />
    
    <!-- 强边缘 - 实线 -->
    <line x1="60" y1="60" x2="140" y2="60" stroke="#000" stroke-width="2" />
    <text x="165" y="65" font-family="Arial, SimHei" font-size="12">强边缘</text>
    
    <!-- 弱边缘 - 虚线 -->
    <line x1="60" y1="80" x2="140" y2="80" stroke="#666" stroke-width="2" stroke-dasharray="5,3" />
    <text x="165" y="85" font-family="Arial, SimHei" font-size="12">弱边缘</text>
    
    <!-- 非边缘 - 无线 -->
    <line x1="60" y1="100" x2="140" y2="100" stroke="#fff" stroke-width="0" />
    <line x1="60" y1="120" x2="140" y2="120" stroke="#fff" stroke-width="0" />
    <text x="165" y="110" font-family="Arial, SimHei" font-size="12">非边缘</text>
    
    <text x="100" y="230" font-family="Arial, SimHei" font-size="16" text-anchor="middle">双阈值分类结果</text>
  </g>
  
  <!-- 中间图表示双阈值原理 -->
  <g transform="translate(250, 80)">
    <rect width="100" height="160" fill="#f9f9f9" stroke="#333" />
    
    <!-- 阈值图示 -->
    <line x1="20" y1="40" x2="80" y2="40" stroke="#333" stroke-width="1" />
    <text x="10" y="45" font-family="Arial, SimHei" font-size="12" text-anchor="end">高阈值</text>
    
    <line x1="20" y1="80" x2="80" y2="80" stroke="#333" stroke-width="1" />
    <text x="10" y="85" font-family="Arial, SimHei" font-size="12" text-anchor="end">低阈值</text>
    
    <!-- 分类区域 -->
    <rect x="30" y="10" width="40" height="30" fill="#333" fill-opacity="0.2" />
    <text x="50" y="25" font-family="Arial, SimHei" font-size="10" text-anchor="middle">强边缘</text>
    
    <rect x="30" y="40" width="40" height="40" fill="#777" fill-opacity="0.2" />
    <text x="50" y="65" font-family="Arial, SimHei" font-size="10" text-anchor="middle">弱边缘</text>
    
    <rect x="30" y="80" width="40" height="60" fill="#bbb" fill-opacity="0.2" />
    <text x="50" y="115" font-family="Arial, SimHei" font-size="10" text-anchor="middle">非边缘</text>
    
    <!-- 渐变条表示梯度强度 -->
    <defs>
      <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#000;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#fff;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <rect x="15" y="10" width="10" height="130" fill="url(#grad)" />
    <text x="50" y="155" font-family="Arial, SimHei" font-size="10" text-anchor="middle">梯度强度</text>
  </g>
  
  <!-- 说明文字 -->
  <g transform="translate(50, 320)">
    <text font-family="Arial, SimHei" font-size="14">
      <tspan x="0" y="0">双阈值处理：</tspan>
      <tspan x="0" y="25">• 使用两个阈值（高阈值和低阈值）将边缘点分为三类</tspan>
      <tspan x="0" y="50">• 梯度强度 > 高阈值：确定为强边缘</tspan>
      <tspan x="0" y="75">• 低阈值 &lt; 梯度强度 &lt; 高阈值：标记为弱边缘（需进一步判断）</tspan>
      <tspan x="0" y="100">• 梯度强度 &lt; 低阈值：丢弃（非边缘）</tspan>
    </text>
  </g>
</svg>