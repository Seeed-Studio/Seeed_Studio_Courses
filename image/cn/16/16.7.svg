<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#2c3e50">PyTorch 神经网络组件架构</text>
  
  <!-- nn.Module 基类 -->
  <g>
    <rect x="300" y="60" width="200" height="60" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="10"/>
    <text x="400" y="85" text-anchor="middle" font-size="16" font-weight="bold" fill="white">nn.Module</text>
    <text x="400" y="105" text-anchor="middle" font-size="12" fill="white">神经网络基类</text>
  </g>
  
  <!-- 模块化设计 -->
  <g>
    <text x="150" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">模块化设计</text>
    <rect x="50" y="200" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    
    <!-- 各个层模块 -->
    <rect x="70" y="220" width="50" height="20" fill="#9b59b6" rx="3"/>
    <text x="95" y="232" text-anchor="middle" font-size="10" fill="white">Linear</text>
    
    <rect x="130" y="220" width="50" height="20" fill="#9b59b6" rx="3"/>
    <text x="155" y="232" text-anchor="middle" font-size="10" fill="white">Conv2d</text>
    
    <rect x="190" y="220" width="50" height="20" fill="#9b59b6" rx="3"/>
    <text x="215" y="232" text-anchor="middle" font-size="10" fill="white">ReLU</text>
    
    <rect x="70" y="250" width="50" height="20" fill="#9b59b6" rx="3"/>
    <text x="95" y="262" text-anchor="middle" font-size="10" fill="white">Dropout</text>
    
    <rect x="130" y="250" width="110" height="20" fill="#9b59b6" rx="3"/>
    <text x="185" y="262" text-anchor="middle" font-size="10" fill="white">BatchNorm</text>
  </g>
  
  <!-- 参数自动管理 -->
  <g>
    <text x="400" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">参数自动管理</text>
    <rect x="300" y="200" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    
    <circle cx="350" cy="230" r="15" fill="#27ae60"/>
    <text x="350" y="235" text-anchor="middle" font-size="10" fill="white">权重</text>
    
    <circle cx="400" cy="230" r="15" fill="#27ae60"/>
    <text x="400" y="235" text-anchor="middle" font-size="10" fill="white">偏置</text>
    
    <circle cx="450" cy="230" r="15" fill="#27ae60"/>
    <text x="450" y="235" text-anchor="middle" font-size="10" fill="white">梯度</text>
    
    <text x="400" y="260" text-anchor="middle" font-size="11" fill="#2c3e50">自动注册和跟踪</text>
  </g>
  
  <!-- 前向传播定义 -->
  <g>
    <text x="650" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#f39c12">前向传播定义</text>
    <rect x="550" y="200" width="200" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    
    <text x="650" y="220" text-anchor="middle" font-size="12" fill="#2c3e50" font-family="monospace">def forward(self, x):</text>
    <text x="650" y="240" text-anchor="middle" font-size="12" fill="#2c3e50" font-family="monospace">    x = self.layer1(x)</text>
    <text x="650" y="260" text-anchor="middle" font-size="12" fill="#2c3e50" font-family="monospace">    return self.layer2(x)</text>
  </g>
  
  <!-- 连接线 -->
  <line x1="350" y1="120" x2="150" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="120" x2="400" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="120" x2="650" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 灵活架构支持 -->
  <g>
    <text x="400" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#8e44ad">灵活的架构支持</text>
    
    <!-- 不同网络类型 -->
    <rect x="50" y="360" width="120" height="60" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="110" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">前馈网络</text>
    <text x="110" y="395" text-anchor="middle" font-size="10" fill="#2c3e50">Sequential</text>
    <text x="110" y="408" text-anchor="middle" font-size="10" fill="#2c3e50">ModuleList</text>
    
    <rect x="200" y="360" width="120" height="60" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="8"/>
    <text x="260" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#f39c12">卷积网络</text>
    <text x="260" y="395" text-anchor="middle" font-size="10" fill="#2c3e50">Conv2d</text>
    <text x="260" y="408" text-anchor="middle" font-size="10" fill="#2c3e50">MaxPool2d</text>
    
    <rect x="350" y="360" width="120" height="60" fill="#f3e5f5" stroke="#9b59b6" stroke-width="2" rx="8"/>
    <text x="410" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#9b59b6">递归网络</text>
    <text x="410" y="395" text-anchor="middle" font-size="10" fill="#2c3e50">LSTM</text>
    <text x="410" y="408" text-anchor="middle" font-size="10" fill="#2c3e50">GRU</text>
    
    <rect x="500" y="360" width="120" height="60" fill="#ffeaea" stroke="#e74c3c" stroke-width="2" rx="8"/>
    <text x="560" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">注意力网络</text>
    <text x="560" y="395" text-anchor="middle" font-size="10" fill="#2c3e50">Transformer</text>
    <text x="560" y="408" text-anchor="middle" font-size="10" fill="#2c3e50">MultiheadAttn</text>
    
    <rect x="650" y="360" width="120" height="60" fill="#e6f3ff" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="710" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#3498db">残差网络</text>
    <text x="710" y="395" text-anchor="middle" font-size="10" fill="#2c3e50">ResNet</text>
    <text x="710" y="408" text-anchor="middle" font-size="10" fill="#2c3e50">DenseNet</text>
  </g>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- 底部说明 -->
  <text x="400" y="460" text-anchor="middle" font-size="12" fill="#7f8c8d">所有神经网络组件都继承自 nn.Module，提供统一的接口和功能</text>
  
</svg>