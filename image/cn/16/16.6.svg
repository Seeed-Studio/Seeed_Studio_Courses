<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">PyTorch 中的继承关系</text>
  
  <!-- nn.Module 父类 -->
  <g>
    <rect x="250" y="80" width="300" height="120" fill="#f4ecf7" stroke="#8e44ad" stroke-width="4" rx="15"/>
    <text x="400" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="#8e44ad">nn.Module</text>
    <text x="400" y="140" text-anchor="middle" font-size="14" fill="#7b1fa2" font-weight="bold">父类 (基础模板)</text>
    
    <text x="290" y="165" font-size="12" fill="#7b1fa2">• 参数自动管理</text>
    <text x="290" y="180" font-size="12" fill="#7b1fa2">• 设备迁移支持</text>
    <text x="440" y="165" font-size="12" fill="#7b1fa2">• 训练模式切换</text>
    <text x="440" y="180" font-size="12" fill="#7b1fa2">• 模块层次结构</text>
  </g>
  
  <!-- 继承说明 -->
  <text x="400" y="240" text-anchor="middle" font-size="16" fill="#8e44ad" font-weight="bold">所有 PyTorch 神经网络组件都继承自 nn.Module</text>
  
  <!-- 继承箭头 -->
  <path d="M300 260 L160 320" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M400 260 L400 320" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M500 260 L640 320" stroke="#8e44ad" stroke-width="3" marker-end="url(#arrow-purple)"/>
  
  <text x="200" y="290" font-size="12" fill="#8e44ad" font-weight="bold">继承</text>
  <text x="410" y="290" font-size="12" fill="#8e44ad" font-weight="bold">继承</text>
  <text x="590" y="290" font-size="12" fill="#8e44ad" font-weight="bold">继承</text>
  
  <!-- 子类示例 -->
  
  <!-- nn.Linear -->
  <g>
    <rect x="50" y="330" width="160" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
    <text x="130" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#1976d2">nn.Linear</text>
    <text x="130" y="375" text-anchor="middle" font-size="12" fill="#1976d2" font-weight="bold">全连接层</text>
    <text x="130" y="395" text-anchor="middle" font-size="10" fill="#1976d2">• 线性变换</text>
    <text x="130" y="408" text-anchor="middle" font-size="10" fill="#1976d2">• 权重和偏置</text>
    <text x="130" y="421" text-anchor="middle" font-size="10" fill="#1976d2">• 自定义前向传播</text>
  </g>
  
  <!-- nn.Conv2d -->
  <g>
    <rect x="320" y="330" width="160" height="100" fill="#e8f5e8" stroke="#388e3c" stroke-width="3" rx="10"/>
    <text x="400" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#388e3c">nn.Conv2d</text>
    <text x="400" y="375" text-anchor="middle" font-size="12" fill="#388e3c" font-weight="bold">二维卷积层</text>
    <text x="400" y="395" text-anchor="middle" font-size="10" fill="#388e3c">• 卷积运算</text>
    <text x="400" y="408" text-anchor="middle" font-size="10" fill="#388e3c">• 特征提取</text>
    <text x="400" y="421" text-anchor="middle" font-size="10" fill="#388e3c">• 自定义前向传播</text>
  </g>
  
  <!-- CustomNet -->
  <g>
    <rect x="590" y="330" width="160" height="100" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="10"/>
    <text x="670" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#f57c00">CustomNet</text>
    <text x="670" y="375" text-anchor="middle" font-size="12" fill="#f57c00" font-weight="bold">自定义网络</text>
    <text x="670" y="395" text-anchor="middle" font-size="10" fill="#f57c00">• 组合多个层</text>
    <text x="670" y="408" text-anchor="middle" font-size="10" fill="#f57c00">• 复杂网络结构</text>
    <text x="670" y="421" text-anchor="middle" font-size="10" fill="#f57c00">• 自定义前向传播</text>
  </g>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow-purple" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#8e44ad"/>
    </marker>
  </defs>
</svg>