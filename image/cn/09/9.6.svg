<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310">
  <!-- 标题 -->
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold">双线性插值示意图</text>
  
  <!-- 像素网格 -->
  <g transform="translate(100,70)">
    <rect width="200" height="200" fill="none" stroke="black"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="black" stroke-dasharray="4"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="black" stroke-dasharray="4"/>
    
    <!-- 四个原始像素点 -->
    <circle cx="50" cy="50" r="5" fill="blue"/>
    <circle cx="150" cy="50" r="5" fill="blue"/>
    <circle cx="50" cy="150" r="5" fill="blue"/>
    <circle cx="150" cy="150" r="5" fill="blue"/>
    
    <!-- 待插值的新像素点 -->
    <circle cx="100" cy="100" r="5" fill="red"/>
    
    <!-- 标注 -->
    <text x="40" y="40">P1</text>
    <text x="160" y="40">P2</text>
    <text x="40" y="160">P3</text>
    <text x="160" y="160">P4</text>
    <text x="110" y="100">P</text>
    
    <!-- 权重示意线 -->
    <line x1="100" y1="100" x2="50" y2="50" stroke="gray" stroke-width="1" stroke-dasharray="2"/>
    <line x1="100" y1="100" x2="150" y2="50" stroke="gray" stroke-width="1" stroke-dasharray="2"/>
    <line x1="100" y1="100" x2="50" y2="150" stroke="gray" stroke-width="1" stroke-dasharray="2"/>
    <line x1="100" y1="100" x2="150" y2="150" stroke="gray" stroke-width="1" stroke-dasharray="2"/>
  </g>
  
  <!-- 图例说明 -->
  <g transform="translate(110,280)">
    <circle cx="15" cy="15" r="5" fill="blue"/>
    <text x="30" y="20" font-size="12">原始像素点</text>
    <circle cx="115" cy="15" r="5" fill="red"/>
    <text x="130" y="20" font-size="12">待插值点</text>
  </g>
  
  <!-- 右侧说明文字 -->
  <g transform="translate(360,100)">
    <text x="0" y="0" font-size="12">双线性插值通过计算周围四个像素的</text>
    <text x="0" y="20" font-size="12">加权平均值得到新像素值</text>
    <text x="0" y="50" font-size="12">权重由待插值点到各原始像素点的</text>
    <text x="0" y="70" font-size="12">距离决定</text>
    
    <!-- 计算公式 -->
    <text x="0" y="100" font-size="12">新像素值P计算：</text>
    <text x="0" y="120" font-size="12">P = w1*P1 + w2*P2 + w3*P3 + w4*P4</text>
    <text x="0" y="140" font-size="12">(w1-w4为距离权重)</text>
  </g>
</svg>