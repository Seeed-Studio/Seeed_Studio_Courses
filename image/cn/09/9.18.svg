<svg viewBox="0 0 950 300" xmlns="http://www.w3.org/2000/svg">
    <!-- 原始3x3区域 -->
    <g transform="translate(50,50)">
        <text x="0" y="-20" font-size="16">原始3x3区域</text>
        <!-- 网格 -->
        <g stroke="gray" stroke-width="1">
            <rect x="0" y="0" width="150" height="150" fill="#f0f0f0"/>
            <line x1="0" y1="50" x2="150" y2="50"/>
            <line x1="0" y1="100" x2="150" y2="100"/>
            <line x1="50" y1="0" x2="50" y2="150"/>
            <line x1="100" y1="0" x2="100" y2="150"/>
        </g>
        <!-- 像素值 -->
        <g font-size="14" text-anchor="middle">
            <text x="25" y="30">20</text>
            <text x="75" y="30">50</text>
            <text x="125" y="30">20</text>
            
            <text x="25" y="80">20</text>
            <text x="75" y="80" fill="red">200</text>
            <text x="125" y="80">20</text>
            
            <text x="25" y="130">20</text>
            <text x="75" y="130">20</text>
            <text x="125" y="130">20</text>
        </g>
        <!-- 高亮3x3区域 -->
        <rect x="50" y="50" width="50" height="50" 
              fill="none" stroke="red" stroke-width="2"/>
    </g>

    <!-- 箭头 -->
    <path d="M 250,100 L 330,100 L 320,90 M 330,100 L 320,110" 
          fill="none" stroke="black" stroke-width="2"/>

    <!-- 排序过程 -->
    <g transform="translate(350,50)">
        <text x="0" y="-20" font-size="16">像素值排序</text>
        <rect x="0" y="0" width="300" height="150" fill="#f0f0f0" stroke="gray"/>
        <text x="10" y="30" font-size="14">
            排序前: 20, 50, 20, 20, 200, 20, 20, 20, 20
        </text>
        <text x="10" y="70" font-size="14">
            排序后: 20, 20, 20, 20, 20, 20, 20, 50, 200
        </text>
        <text x="10" y="110" font-size="14" fill="blue">
            中值(第5个数) = 20
        </text>
    </g>

    <!-- 箭头 -->
    <path d="M 700,100 L 730,100 L 720,90 M 730,100 L 720,110" 
          fill="none" stroke="black" stroke-width="2"/>

    <!-- 结果 -->
    <g transform="translate(750,50)">
      <text x="0" y="-20" font-size="16">原始3x3区域</text>
        <!-- 网格 -->
        <g stroke="gray" stroke-width="1">
            <rect x="0" y="0" width="150" height="150" fill="#f0f0f0"/>
            <line x1="0" y1="50" x2="150" y2="50"/>
            <line x1="0" y1="100" x2="150" y2="100"/>
            <line x1="50" y1="0" x2="50" y2="150"/>
            <line x1="100" y1="0" x2="100" y2="150"/>
        </g>
        <!-- 像素值 -->
        <g font-size="14" text-anchor="middle">
            <text x="25" y="30">20</text>
            <text x="75" y="30">50</text>
            <text x="125" y="30">20</text>
            
            <text x="25" y="80">20</text>
            <text x="75" y="80" fill="red">20</text>
            <text x="125" y="80">20</text>
            
            <text x="25" y="130">20</text>
            <text x="75" y="130">20</text>
            <text x="125" y="130">20</text>
        </g>   
        <!-- 高亮3x3区域 -->
        <rect x="50" y="50" width="50" height="50" 
              fill="none" stroke="red" stroke-width="2"/>
    </g>

    <!-- 说明文本 -->
    <g transform="translate(50,250)">
        <text x="0" y="0" font-size="14">特点:</text>
        <text x="0" y="25" font-size="14">1. 有效去除椒盐噪声(异常值200被过滤)</text>
        <text x="250" y="25" font-size="14">2. 不会产生新的像素值</text>
    </g>
</svg>