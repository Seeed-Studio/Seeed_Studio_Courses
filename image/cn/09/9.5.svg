<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <!-- 标题 -->
  <text x="190" y="30" text-anchor="middle" font-size="16" font-weight="bold">最近邻插值示意图</text>
  
  <!-- 原始像素 -->
  <g transform="translate(50,70)">
    <rect width="80" height="80" fill="none" stroke="black"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="black"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="black"/>
    <text x="20" y="25" text-anchor="middle">A</text>
    <text x="60" y="25" text-anchor="middle">B</text>
    <text x="20" y="65" text-anchor="middle">C</text>
    <text x="60" y="65" text-anchor="middle">D</text>
    <text x="40" y="-10" text-anchor="middle" font-size="12">原始像素</text>
  </g>
  
  <!-- 箭头 -->
  <g transform="translate(150,100)">
    <path d="M0,0 L60,0" stroke="black" marker-end="url(#arrow)"/>
    <text x="30" y="-10" text-anchor="middle">插值</text>
  </g>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"/>
    </marker>
  </defs>
  
  <!-- 插值后的像素 -->
  <g transform="translate(240,70)">
    <rect width="120" height="80" fill="none" stroke="black"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="black"/>
    <line x1="80" y1="0" x2="80" y2="80" stroke="black"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="black"/>
    <text x="20" y="25" text-anchor="middle">A</text>
    <text x="60" y="25" text-anchor="middle">A</text>
    <text x="100" y="25" text-anchor="middle">B</text>
    <text x="20" y="65" text-anchor="middle">C</text>
    <text x="60" y="65" text-anchor="middle">C</text>
    <text x="100" y="65" text-anchor="middle">D</text>
    <text x="60" y="-10" text-anchor="middle" font-size="12">插值后的像素</text>
  </g>

  <!-- 说明文字 -->
  <text x="200" y="200" text-anchor="middle" font-size="12">最近邻插值选择距离目标位置最近的原始像素值作为新像素值</text>
  <text x="200" y="220" text-anchor="middle" font-size="12">计算速度最快，但可能产生锯齿状边缘</text>
</svg>