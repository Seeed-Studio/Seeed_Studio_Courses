<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 520">
  <!-- 背景 -->
  <rect width="830" height="520" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#333333" font-weight="bold">BFMatcher 特征匹配工作流程</text>
  
  <!-- 左侧：图像和特征点 -->
  <rect x="50" y="70" width="260" height="140" rx="5" ry="5" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
  
  <!-- 参考图像 -->
  <rect x="70" y="90" width="100" height="100" fill="#e1f5fe" stroke="#03a9f4" stroke-width="2"/>
  <text x="120" y="75" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">参考图像</text>
  <circle cx="95" cy="115" r="6" fill="#f44336"/>
  <circle cx="120" cy="135" r="6" fill="#f44336"/>
  <circle cx="140" cy="110" r="6" fill="#f44336"/>
  <text x="95" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">1</text>
  <text x="120" y="138" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">2</text>
  <text x="140" y="113" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">3</text>
  
  <!-- 场景图像 -->
  <rect x="190" y="90" width="100" height="100" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="240" y="75" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">场景图像</text>
  <circle cx="215" cy="115" r="6" fill="#4caf50"/>
  <circle cx="240" cy="105" r="6" fill="#4caf50"/>
  <circle cx="265" cy="130" r="6" fill="#4caf50"/>
  <circle cx="220" cy="140" r="6" fill="#4caf50"/>
  <text x="215" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">A</text>
  <text x="240" y="108" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">B</text>
  <text x="265" y="133" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">C</text>
  <text x="220" y="143" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">D</text>
  
  <!-- 右侧：工作流程图 -->
  <!-- 步骤1：计算描述符距离 -->
  <rect x="400" y="70" width="390" height="120" rx="5" ry="5" fill="#f9f9f9" stroke="#cccccc" stroke-width="1"/>
  <text x="575" y="60" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">1. 计算特征点间的距离</text>
  
  <text x="425" y="100" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#333">参考点1:</text>
  <text x="520" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">与场景点A的距离: 78</text>
  <text x="520" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">与场景点B的距离: 54</text>
  <text x="520" y="140" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">与场景点C的距离: 92</text>
  <text x="520" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">与场景点D的距离: 63</text>
  
  <text x="670" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333" font-style="italic">距离值越小，</text>
  <text x="670" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#333" font-style="italic">表示特征点越相似</text>
  
  <!-- 步骤2：选择最小距离 -->
  <rect x="400" y="230" width="390" height="100" rx="5" ry="5" fill="#f9f9f9" stroke="#cccccc" stroke-width="1"/>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">2. 为每个特征点选择最小距离匹配</text>
  
  <text x="450" y="275" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#333">参考点1 → 场景点B</text>
  <text x="450" y="300" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#333">参考点2 → 场景点A</text>
  <text x="450" y="325" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#333">参考点3 → 场景点D</text>
  
  <text x="625" y="275" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">(距离: 54)</text>
  <text x="625" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">(距离: 42)</text>
  <text x="625" y="325" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">(距离: 35)</text>
  
  <!-- 步骤3：筛选匹配 -->
  <rect x="400" y="360" width="390" height="140" rx="5" ry="5" fill="#f9f9f9" stroke="#cccccc" stroke-width="1"/>
  <text x="575" y="380" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">3. 应用筛选策略去除错误匹配</text>
  
  <text x="450" y="400" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#333">方法1: 距离阈值</text>
  <text x="485" y="420" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">仅保留距离小于阈值的匹配</text>
  
  <text x="450" y="450" font-family="Arial, sans-serif" font-size="16" text-anchor="start" fill="#333">方法2: 比值测试</text>
  <text x="485" y="470" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">如果最佳匹配距离显著小于次佳匹配距离，</text>
  <text x="485" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="start" fill="#666">则认为是好的匹配</text>
  
  <!-- 连接箭头 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  
  <path d="M310 140 L400 140" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M575 190 L575 230" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M575 330 L575 360" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 最终结果示意 -->
  <rect x="50" y="350" width="260" height="130" rx="5" ry="5" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
  <text x="180" y="340" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">最终匹配结果</text>
  
  <!-- 复制参考图像和场景图像，但更小 -->
  <rect x="70" y="370" width="80" height="80" fill="#e1f5fe" stroke="#03a9f4" stroke-width="2"/>
  <circle cx="92" cy="390" r="5" fill="#f44336"/>
  <circle cx="110" cy="405" r="5" fill="#f44336"/>
  <circle cx="125" cy="385" r="5" fill="#f44336"/>
  <text x="92" y="393" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">1</text>
  <text x="110" y="408" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">2</text>
  <text x="125" y="388" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">3</text>
  
  <rect x="200" y="370" width="80" height="80" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <circle cx="220" cy="390" r="5" fill="#4caf50"/>
  <circle cx="240" cy="385" r="5" fill="#4caf50"/>
  <circle cx="255" cy="405" r="5" fill="#4caf50"/>
  <circle cx="225" cy="410" r="5" fill="#4caf50"/>
  <text x="220" y="393" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">A</text>
  <text x="240" y="388" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">B</text>
  <text x="255" y="408" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">C</text>
  <text x="225" y="413" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">D</text>
  
  <!-- 连接匹配点 -->
  <line x1="92" y1="390" x2="240" y2="385" stroke="#ff5722" stroke-width="1.5"/>
  <line x1="110" y1="405" x2="220" y2="390" stroke="#ff5722" stroke-width="1.5"/>
  <line x1="125" y1="385" x2="225" y2="410" stroke="#ff5722" stroke-width="1.5"/>
  
  <text x="160" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">通过匹配关系确定物体位置</text>
</svg>