<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <!-- 背景 -->
  <rect width="900" height="450" fill="#ffffff"/>
  
  <!-- 标题 -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#333333" font-weight="bold">ORB 算法工作流程</text>
  
  <!-- 左右标题 -->
  <text x="225" y="70" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1976d2" font-weight="bold">特征点检测</text>
  <text x="675" y="70" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4caf50" font-weight="bold">特征描述</text>
  
  <!-- 左侧（特征点检测）流程 -->
  <rect x="125" y="90" width="200" height="70" rx="10" ry="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="225" y="120" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">FAST角点检测</text>
  <text x="225" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">检测像素值变化显著的点</text>
  
  <rect x="125" y="190" width="200" height="70" rx="10" ry="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="225" y="220" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">Harris角点筛选</text>
  <text x="225" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">选择强度最高的N个角点</text>
  
  <rect x="125" y="290" width="200" height="70" rx="10" ry="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="225" y="320" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">方向计算</text>
  <text x="225" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">为每个角点赋予旋转属性</text>
  
  <!-- 左侧示意图 -->
  <rect x="140" y="380" width="170" height="50" rx="5" ry="5" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/>
  <circle cx="160" cy="400" r="6" fill="#ff5722" stroke="#ffffff" stroke-width="1"/>
  <circle cx="190" cy="410" r="6" fill="#ff5722" stroke="#ffffff" stroke-width="1"/>
  <circle cx="220" cy="390" r="6" fill="#ff5722" stroke="#ffffff" stroke-width="1"/>
  <circle cx="250" cy="405" r="6" fill="#ff5722" stroke="#ffffff" stroke-width="1"/>
  <line x1="160" y1="400" x2="180" y2="390" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="220" y1="390" x2="240" y2="385" stroke="#1976d2" stroke-width="1.5"/>
  
  <!-- 右侧（特征描述）流程 -->
  <rect x="575" y="90" width="200" height="70" rx="10" ry="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="675" y="120" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">选取采样点对</text>
  <text x="675" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">在特征点周围确定采样位置</text>
  
  <rect x="575" y="190" width="200" height="70" rx="10" ry="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="675" y="220" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">计算亮度差值</text>
  <text x="675" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">比较每对点的亮度值</text>
  
  <rect x="575" y="290" width="200" height="70" rx="10" ry="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="675" y="320" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">生成二进制描述符</text>
  <text x="675" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">构建独特的"数字指纹"</text>
  
  <!-- 右侧示意图 -->
  <rect x="590" y="380" width="170" height="50" rx="5" ry="5" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/>
  <circle cx="675" cy="405" r="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <line x1="660" y1="395" x2="690" y2="400" stroke="#4caf50" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="665" y1="410" x2="685" y2="395" stroke="#4caf50" stroke-width="1" stroke-dasharray="2,1"/>
  <text x="660" y="420" font-family="Courier New, monospace" font-size="10" text-anchor="middle" fill="#333333">10110101...</text>
  
  <!-- 连接箭头 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666666"/>
    </marker>
  </defs>
  
  <!-- 左侧流程连接线 -->
  <line x1="225" y1="160" x2="225" y2="190" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="225" y1="260" x2="225" y2="290" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 右侧流程连接线 -->
  <line x1="675" y1="160" x2="675" y2="190" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="675" y1="260" x2="675" y2="290" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/>
  

  
  <!-- 中间部分 -->
  <rect x="375" y="160" width="150" height="100" rx="10" ry="10" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="450" y="180" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333333" font-weight="bold">ORB特征</text>
  <text x="450" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">• 旋转不变性</text>
  <text x="450" y="230" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">• 部分尺度不变性</text>
  <text x="450" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">• 高效计算</text>
  
  <!-- 结果指向中间 -->
  <line x1="325" y1="325" x2="375" y2="260" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="325" x2="525" y2="260" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>