<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="300" fill="#f8f9fa" />
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">边缘AI学习路线图</text>
  
  <!-- 主路径 -->
  <path d="M100,150 L700,150" stroke="#e0e0e0" stroke-width="8" stroke-linecap="round" />
  
  <!-- 阶段1: 当前课程 -->
  <circle cx="100" cy="150" r="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" />
  <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">深度学习概述</text>
  <text x="100" y="165" text-anchor="middle" font-family="Arial" font-size="12">与数据准备</text>
  
  <!-- 阶段2: PyTorch基础 -->
  <circle cx="250" cy="150" r="50" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" />
  <text x="250" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">PyTorch基础</text>
  <text x="250" y="165" text-anchor="middle" font-family="Arial" font-size="12">神经网络构建</text>
  
  <!-- 阶段3: CNN与迁移学习 -->
  <circle cx="400" cy="150" r="50" fill="#fff3e0" stroke="#f57c00" stroke-width="3" />
  <text x="400" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">卷积神经网络</text>
  <text x="400" y="160" text-anchor="middle" font-family="Arial" font-size="12">与迁移学习</text>
  
  <!-- 阶段4: 目标检测 -->
  <circle cx="550" cy="150" r="50" fill="#e1f5fe" stroke="#0288d1" stroke-width="3" />
  <text x="550" y="145" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">目标检测</text>
  <text x="550" y="165" text-anchor="middle" font-family="Arial" font-size="12">YOLO模型应用</text>
  
  <!-- 阶段5: 智能监控系统 -->
  <circle cx="700" cy="150" r="50" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" />
  <text x="700" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">智能监控</text>
  <text x="700" y="160" text-anchor="middle" font-family="Arial" font-size="12">系统实现</text>
  
  <!-- 知识流向箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#757575" />
    </marker>
  </defs>
  
  <line x1="150" y1="150" x2="180" y2="150" stroke="#757575" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="300" y1="150" x2="330" y2="150" stroke="#757575" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="450" y1="150" x2="480" y2="150" stroke="#757575" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="600" y1="150" x2="630" y2="150" stroke="#757575" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- 关键技能说明 -->
  <rect x="100" y="220" width="600" height="50" rx="10" fill="white" stroke="#e0e0e0" stroke-width="1" />
  <text x="400" y="240" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold">技能积累与应用实现</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial" font-size="14">从理论基础到实际应用，逐步构建边缘AI解决方案</text>
</svg>
