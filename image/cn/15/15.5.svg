<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 16px sans-serif; fill: black; text-anchor: middle; }
    .label { font: bold 14px sans-serif; fill: #555555; }
    .node { fill: #66ccff; stroke: #3399ff; stroke-width: 2; }
    .link { stroke: #666; stroke-width: 1; fill: none; }
    .layerlabel { font: 13px sans-serif; fill: black; text-anchor: middle; }
  </style>

  <!-- 标题 -->
  <text x="200" y="20" class="title">神经网络结构</text>

  <!-- 层标题 -->
  <text x="40" y="50" class="label">输入层</text>
  <text x="180" y="50" class="label">隐藏层</text>
  <text x="320" y="50" class="label">输出层</text>

  <!-- 输入层节点 -->
  <circle class="node" cx="60" cy="100" r="15"/>
  <circle class="node" cx="60" cy="160" r="15"/>
  <circle class="node" cx="60" cy="220" r="15"/>

  <!-- 隐藏层节点 -->
  <circle class="node" cx="200" cy="100" r="15"/>
  <circle class="node" cx="200" cy="160" r="15"/>
  <circle class="node" cx="200" cy="220" r="15"/>

  <!-- 输出层节点 -->
  <circle class="node" cx="340" cy="130" r="15"/>
  <circle class="node" cx="340" cy="190" r="15"/>

  <!-- 输入层 -> 隐藏层连线 -->
  <line class="link" x1="75" y1="100" x2="185" y2="100"/>
  <line class="link" x1="75" y1="100" x2="185" y2="160"/>
  <line class="link" x1="75" y1="100" x2="185" y2="220"/>
  <line class="link" x1="75" y1="160" x2="185" y2="100"/>
  <line class="link" x1="75" y1="160" x2="185" y2="220"/>
  <line class="link" x1="75" y1="220" x2="185" y2="160"/>
  <line class="link" x1="75" y1="220" x2="185" y2="220"/>

  <!-- 隐藏层 -> 输出层连线（全连接） -->
  <line class="link" x1="215" y1="100" x2="325" y2="130"/>
  <line class="link" x1="215" y1="100" x2="325" y2="190"/>
  <line class="link" x1="215" y1="160" x2="325" y2="130"/>
  <line class="link" x1="215" y1="160" x2="325" y2="190"/>
  <line class="link" x1="215" y1="220" x2="325" y2="130"/>
  <line class="link" x1="215" y1="220" x2="325" y2="190"/>

  <!-- 底部层标注 -->
  <text class="layerlabel" x="60" y="280">[x1, x2, x3]</text>
  <text class="layerlabel" x="200" y="280">[h1, h2, h3]</text>
  <text class="layerlabel" x="340" y="280">[y1, y2]</text>
</svg>
