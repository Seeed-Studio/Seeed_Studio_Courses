<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">目标检测评价指标体系</text>
  
  <!-- IoU Section -->
  <g>
    <rect x="50" y="60" width="280" height="200" fill="#fff" stroke="#3498db" stroke-width="2" rx="8"/>
    <text x="190" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">IoU (交集与并集比)</text>
    
    <!-- IoU illustration -->
    <g transform="translate(80, 100)">
      <!-- Ground Truth -->
      <rect x="20" y="20" width="80" height="60" fill="#27ae60" fill-opacity="0.4" stroke="#27ae60" stroke-width="2"/>
      <text x="60" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">真实框</text>
      
      <!-- Prediction -->
      <rect x="40" y="30" width="80" height="60" fill="#e74c3c" fill-opacity="0.4" stroke="#e74c3c" stroke-width="2"/>
      <text x="80" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">预测框</text>
      
      <!-- Intersection -->
      <rect x="40" y="30" width="60" height="50" fill="#f39c12" fill-opacity="0.6"/>
      <text x="70" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff" font-weight="bold">交集</text>
    </g>
    
    <text x="70" y="220" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">IoU = 交集面积 / 并集面积</text>
    <text x="70" y="235" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• 范围: [0, 1]</text>
    <text x="70" y="250" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">• 阈值通常设为 0.5</text>
  </g>
  
  <!-- Precision & Recall Section -->
  <g>
    <rect x="360" y="60" width="280" height="200" fill="#fff" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="500" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">精确率 与 召回率</text>
    
    <!-- Confusion Matrix -->
    <g transform="translate(380, 100)">
      <rect x="0" y="0" width="240" height="120" fill="#ecf0f1" stroke="#bdc3c7"/>
      
      <!-- Header -->
      <text x="120" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">预测结果</text>
      <text x="15" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50" transform="rotate(-90, 15, 65)">真实标签</text>
      
      <!-- Matrix cells -->
      <rect x="60" y="25" width="80" height="40" fill="#2ecc71" fill-opacity="0.3" stroke="#27ae60"/>
      <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">正例</text>
      <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">TP</text>
      <text x="100" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">真正例</text>
      
      <rect x="140" y="25" width="80" height="40" fill="#e74c3c" fill-opacity="0.3" stroke="#c0392b"/>
      <text x="180" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">负例</text>
      <text x="180" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">FN</text>
      <text x="180" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">假负例</text>
      
      <rect x="60" y="65" width="80" height="40" fill="#f39c12" fill-opacity="0.3" stroke="#e67e22"/>
      <text x="100" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">FP</text>
      <text x="100" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">假正例</text>
      
      <rect x="140" y="65" width="80" height="40" fill="#95a5a6" fill-opacity="0.3" stroke="#7f8c8d"/>
      <text x="180" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#95a5a6">TN</text>
      <text x="180" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7f8c8d">真负例</text>
      
      <!-- Labels -->
      <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">正例</text>
      <text x="35" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">负例</text>
    </g>
    
    <text x="375" y="235" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">精确率 = TP / (TP + FP)</text>
    <text x="375" y="250" font-family="Arial, sans-serif" font-size="11" fill="#3498db">召回率 = TP / (TP + FN)</text>
  </g>
  
  <!-- AP & mAP Section -->
  <g>
    <rect x="670" y="60" width="280" height="200" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="8"/>
    <text x="810" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">AP 与 mAP</text>
    
    <!-- PR Curve illustration -->
    <g transform="translate(690, 100)">
      <rect x="0" y="0" width="120" height="90" fill="#f8f9fa" stroke="#bdc3c7"/>
      <text x="60" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">召回率</text>
      <text x="-5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50" transform="rotate(-90, -5, 50)">精确率</text>
      
      <!-- PR Curve -->
      <path d="M 10 80 Q 30 60, 50 50 Q 70 45, 90 40 Q 100 38, 110 35" 
            stroke="#9b59b6" stroke-width="2" fill="none"/>
      <path d="M 10 80 Q 30 60, 50 50 Q 70 45, 90 40 Q 100 38, 110 35 L 110 80 L 10 80 Z" 
            fill="#9b59b6" fill-opacity="0.2"/>
      <text x="60" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#9b59b6">AUC = AP</text>
    </g>
    
    <text x="830" y="130" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">AP (平均精确率)</text>
    <text x="830" y="145" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• PR曲线下面积</text>
    <text x="830" y="160" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• 单个类别的性能</text>
    
    <text x="830" y="185" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">mAP (平均平均精确率)</text>
    <text x="830" y="200" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• 所有类别AP的平均值</text>
    <text x="830" y="215" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">• 模型整体性能指标</text>
    
    <text x="690" y="245" font-family="Arial, sans-serif" font-size="11" fill="#9b59b6">mAP = (AP₁ + AP₂ + ... + APₙ) / n</text>
  </g>
  
  <!-- Evaluation Process Flow -->
  <g>
    <rect x="50" y="300" width="900" height="250" fill="#fff" stroke="#34495e" stroke-width="2" rx="8"/>
    <text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">目标检测评价流程</text>
    
    <!-- Step 1 -->
    <g transform="translate(80, 350)">
      <circle cx="30" cy="30" r="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">1</text>
      <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">IoU计算</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">预测框与真实框</text>
      <text x="30" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">重叠度计算</text>
    </g>
    
    <!-- Arrow 1 -->
    <path d="M 160 380 L 200 380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 2 -->
    <g transform="translate(220, 350)">
      <circle cx="30" cy="30" r="25" fill="#27ae60" stroke="#229954" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">2</text>
      <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">匹配判断</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">IoU > 阈值</text>
      <text x="30" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">→ TP, 否则 FP</text>
    </g>
    
    <!-- Arrow 2 -->
    <path d="M 300 380 L 340 380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 3 -->
    <g transform="translate(360, 350)">
      <circle cx="30" cy="30" r="25" fill="#e74c3c" stroke="#cb4335" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">3</text>
      <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">指标计算</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">精确率、召回率</text>
      <text x="30" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">F1分数等</text>
    </g>
    
    <!-- Arrow 3 -->
    <path d="M 440 380 L 480 380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 4 -->
    <g transform="translate(500, 350)">
      <circle cx="30" cy="30" r="25" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">4</text>
      <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">PR曲线</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">不同阈值下的</text>
      <text x="30" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">精确率-召回率</text>
    </g>
    
    <!-- Arrow 4 -->
    <path d="M 580 380 L 620 380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 5 -->
    <g transform="translate(640, 350)">
      <circle cx="30" cy="30" r="25" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">5</text>
      <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">AP计算</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">PR曲线下面积</text>
      <text x="30" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">单类别性能</text>
    </g>
    
    <!-- Arrow 5 -->
    <path d="M 720 380 L 760 380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Step 6 -->
    <g transform="translate(780, 350)">
      <circle cx="30" cy="30" r="25" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">6</text>
      <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">mAP计算</text>
      <text x="30" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">所有类别AP</text>
      <text x="30" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">的平均值</text>
    </g>
    
    <!-- Common IoU Thresholds -->
    <rect x="100" y="450" width="750" height="70" fill="#ecf0f1" stroke="#bdc3c7" rx="5"/>
    <text x="475" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">常用评价指标</text>
    
    <text x="120" y="490" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• mAP@0.5: IoU阈值为0.5时的mAP</text>
    <text x="420" y="490" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• mAP@0.5:0.95: IoU从0.5到0.95的平均mAP</text>
    
    <text x="120" y="505" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• AP50: 单类别在IoU=0.5时的AP</text>
    <text x="420" y="505" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• F1-Score: 精确率和召回率的调和平均</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>