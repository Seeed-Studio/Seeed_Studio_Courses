<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">边界框的基本概念和表示方法</text>
  
  <!-- Left side: Image with bounding box -->
  <g>
    <!-- Image area -->
    <rect x="50" y="60" width="300" height="240" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
    <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">示例图像 (300×240)</text>
    
    <!-- Coordinate system arrows -->
    <line x1="50" y1="60" x2="80" y2="60" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="85" y="55" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">X</text>
    <line x1="50" y1="60" x2="50" y2="90" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="40" y="100" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">Y</text>
    <text x="35" y="55" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">(0,0)</text>
    
    <!-- Object (cat silhouette) -->
    <ellipse cx="180" cy="150" rx="40" ry="30" fill="#95a5a6"/>
    <circle cx="170" cy="140" r="15" fill="#95a5a6"/>
    <polygon points="155,135 165,125 175,135" fill="#95a5a6"/>
    <text x="180" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">检测物体</text>
    
    <!-- Bounding box -->
    <rect x="130" y="120" width="100" height="60" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Corner points -->
    <circle cx="130" cy="120" r="3" fill="#e74c3c"/>
    <circle cx="230" cy="180" r="3" fill="#e74c3c"/>
    <text x="110" y="115" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">(x1,y1)</text>
    <text x="235" y="195" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">(x2,y2)</text>
    
    <!-- Center point -->
    <circle cx="180" cy="150" r="3" fill="#ffffff"/>
    <text x="185" y="145" font-family="Arial, sans-serif" font-size="10" fill="#ffffff">(xc,yc)</text>
  </g>
  
  <!-- Right side: Format representations -->
  <g>
    <!-- XYXY Format -->
    <rect x="400" y="50" width="320" height="80" fill="#fff" stroke="#3498db" stroke-width="2" rx="5"/>
    <text x="560" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">XYXY 格式</text>
    <text x="420" y="90" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• 表示方法: (x1, y1, x2, y2)</text>
    <text x="420" y="105" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• x1, y1: 左上角坐标</text>
    <text x="420" y="120" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• x2, y2: 右下角坐标</text>
    
    <!-- XYWH Format -->
    <rect x="400" y="150" width="320" height="80" fill="#fff" stroke="#27ae60" stroke-width="2" rx="5"/>
    <text x="560" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">XYWH 格式</text>
    <text x="420" y="190" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• 表示方法: (x_center, y_center, width, height)</text>
    <text x="420" y="205" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• x_center, y_center: 中心点坐标</text>
    <text x="420" y="220" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• width, height: 边界框宽度和高度</text>
    
    <!-- Normalized Format -->
    <rect x="400" y="250" width="320" height="80" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="5"/>
    <text x="560" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">归一化格式</text>
    <text x="420" y="290" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• 坐标范围: [0, 1]</text>
    <text x="420" y="305" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• 相对于图像尺寸的比例</text>
    <text x="420" y="320" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">• 适应不同图像大小</text>
  </g>
  
  <!-- Example values -->
  <g>
    <rect x="50" y="350" width="700" height="120" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1" rx="5"/>
    <text x="400" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">示例数值</text>
    
    <text x="70" y="395" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c">XYXY 格式:</text>
    <text x="170" y="395" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">[130, 120, 230, 180]</text>
    <text x="400" y="395" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">→ 左上(130,120), 右下(230,180)</text>
    
    <text x="70" y="415" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">XYWH 格式:</text>
    <text x="170" y="415" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">[180, 150, 100, 60]</text>
    <text x="400" y="415" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">→ 中心(180,150), 宽100, 高60</text>
    
    <text x="70" y="435" font-family="Arial, sans-serif" font-size="12" fill="#9b59b6">归一化格式:</text>
    <text x="170" y="435" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">[0.43, 0.50, 0.77, 0.75]</text>
    <text x="400" y="435" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">→ 相对坐标 (除以图像宽高)</text>
    
    <text x="70" y="455" font-family="Arial, sans-serif" font-size="12" fill="#e67e22">坐标系统:</text>
    <text x="170" y="455" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">原点在左上角 (0,0), X向右递增, Y向下递增</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>