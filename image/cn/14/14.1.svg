<svg viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect x="0" y="0" width="600" height="380" fill="#f8f9fa"/>
  <!-- 主控模块 -->
  <rect x="240" y="40" width="120" height="60" rx="10" fill="#ff9966" stroke="#333333" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" font-family="Arial" font-size="16">主控模块</text>
  
  <!-- 各功能模块 -->
  <rect x="80" y="160" width="120" height="60" rx="10" fill="#bbbbff" stroke="#3333ff" stroke-width="1"/>
  <text x="140" y="195" text-anchor="middle" font-family="Arial" font-size="16">视频处理模块</text>
  
  <rect x="240" y="160" width="120" height="60" rx="10" fill="#bbbbff" stroke="#3333ff" stroke-width="1"/>
  <text x="300" y="195" text-anchor="middle" font-family="Arial" font-size="16">图像处理模块</text>
  
  <rect x="400" y="160" width="120" height="60" rx="10" fill="#bbbbff" stroke="#3333ff" stroke-width="1"/>
  <text x="460" y="195" text-anchor="middle" font-family="Arial" font-size="16">特征检测模块</text>
  
  <!-- 用户界面模块 -->
  <rect x="240" y="310" width="120" height="60" rx="10" fill="#bbffbb" stroke="#33ff33" stroke-width="1"/>
  <text x="300" y="345" text-anchor="middle" font-family="Arial" font-size="16">用户界面模块</text>
  
  <!-- 连接线 -->
  <line x1="300" y1="100" x2="300" y2="160" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="100" x2="140" y2="160" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="100" x2="460" y2="160" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="140" y1="220" x2="300" y2="280" stroke="#333333" stroke-width="2"/>
  <line x1="300" y1="220" x2="300" y2="310" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="220" x2="300" y2="280" stroke="#333333" stroke-width="2"/>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333333" />
    </marker>
  </defs>
</svg>