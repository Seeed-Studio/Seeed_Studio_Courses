<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="400" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" fill="#333" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">积分图的工作原理</text>
  
  <!-- 左侧：原始图像 -->
  <g transform="translate(100, 100)">
    <!-- 网格 -->
    <rect x="0" y="0" width="200" height="200" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
    
    <!-- 水平线 -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#999" stroke-width="1"/>
    
    <!-- 垂直线 -->
    <line x1="40" y1="0" x2="40" y2="200" stroke="#999" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="200" stroke="#999" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="200" stroke="#999" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#999" stroke-width="1"/>
    
    <!-- 样本像素值 -->
    <text x="20" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">1</text>
    <text x="60" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">2</text>
    <text x="100" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">3</text>
    <text x="140" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">4</text>
    <text x="180" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">5</text>
    
    <text x="20" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">6</text>
    <text x="60" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">7</text>
    <text x="100" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">8</text>
    <text x="140" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">9</text>
    <text x="180" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">10</text>
    
    <text x="20" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">11</text>
    <text x="60" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">12</text>
    <text x="100" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">13</text>
    <text x="140" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">14</text>
    <text x="180" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">15</text>
    
    <text x="20" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">16</text>
    <text x="60" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">17</text>
    <text x="100" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">18</text>
    <text x="140" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">19</text>
    <text x="180" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">20</text>
    
    <text x="20" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">21</text>
    <text x="60" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">22</text>
    <text x="100" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">23</text>
    <text x="140" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">24</text>
    <text x="180" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">25</text>
    
    <!-- 标题 -->
    <text x="100" y="-30" fill="#333" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">原始图像</text>
    <text x="100" y="-10" fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">（每个单元格是图像像素）</text>
  </g>
  
  <!-- 右侧：积分图 -->
  <g transform="translate(500, 100)">
    <!-- 网格 -->
    <rect x="0" y="0" width="200" height="200" fill="#e0f0ff" stroke="#333" stroke-width="2"/>
    
    <!-- 水平线 -->
    <line x1="0" y1="40" x2="200" y2="40" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#999" stroke-width="1"/>
    
    <!-- 垂直线 -->
    <line x1="40" y1="0" x2="40" y2="200" stroke="#999" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="200" stroke="#999" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="200" stroke="#999" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="200" stroke="#999" stroke-width="1"/>
    
    <!-- 积分图像素值 -->
    <text x="20" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">1</text>
    <text x="60" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">3</text>
    <text x="100" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">6</text>
    <text x="140" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">10</text>
    <text x="180" y="20" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">15</text>
    
    <text x="20" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">7</text>
    <text x="60" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">16</text>
    <text x="100" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">27</text>
    <text x="140" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">40</text>
    <text x="180" y="60" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">55</text>
    
    <text x="20" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">18</text>
    <text x="60" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">38</text>
    <text x="100" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">62</text>
    <text x="140" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">90</text>
    <text x="180" y="100" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">120</text>
    
    <text x="20" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">34</text>
    <text x="60" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">71</text>
    <text x="100" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">112</text>
    <text x="140" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">159</text>
    <text x="180" y="140" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">210</text>
    
    <text x="20" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">55</text>
    <text x="60" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">115</text>
    <text x="100" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">178</text>
    <text x="140" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">248</text>
    <text x="180" y="180" font-family="Courier New, monospace" font-size="12" text-anchor="middle" dominant-baseline="middle">325</text>
    
    <!-- 标题 -->
    <text x="100" y="-30" fill="#333" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">积分图</text>
    <text x="100" y="-10" fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">（每个值是左上角到该点的像素和）</text>
  </g>
  
  <!-- 矩形区域示例 -->
  <g transform="translate(500, 100)">
    <!-- 标记感兴趣区域 -->
    <rect x="80" y="80" width="80" height="80" fill="none" stroke="#f55" stroke-width="2" stroke-dasharray="5,3"/>
    
    <!-- 标记四个角点 -->
    <circle cx="80" cy="80" r="5" fill="#5a5"/>
    <text x="75" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="end" dominant-baseline="auto">A (62)</text>
    
    <circle cx="160" cy="80" r="5" fill="#5a5"/>
    <text x="165" y="75" font-family="Arial, sans-serif" font-size="10" text-anchor="start" dominant-baseline="auto">B (90)</text>
    
    <circle cx="80" cy="160" r="5" fill="#5a5"/>
    <text x="75" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="end" dominant-baseline="baseline">C (112)</text>
    
    <circle cx="160" cy="160" r="5" fill="#5a5"/>
    <text x="165" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="start" dominant-baseline="baseline">D (159)</text>
  </g>
  
  <!-- 计算公式 -->
  <g transform="translate(400, 350)">
    <rect x="-250" y="-20" width="500" height="40" fill="#e9e9e9" rx="10" ry="10"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">
      矩形区域像素和 = D - B - C + A = 159 - 90 - 112 + 62 = 19
    </text>
  </g>
  
  <!-- 连接箭头 -->
  <path d="M350 200 L450 200" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 定义箭头标记 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>