<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1000" height="500" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">CNN架构发展历程</text>
  
  <!-- 时间轴 -->
  <line x1="100" y1="80" x2="900" y2="80" stroke="#34495e" stroke-width="4"/>
  
  <!-- LeNet-5 (1998) -->
  <g transform="translate(150, 60)">
    <circle cx="0" cy="20" r="10" fill="#3498db"/>
    <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">1998</text>
    
    <!-- 简化网络结构 -->
    <g transform="translate(-80, 80)">
      <text x="80" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#3498db">LeNet-5</text>
      
      <!-- 简化的网络流程 -->
      <rect x="0" y="0" width="25" height="30" fill="#e8f4fd" stroke="#3498db" stroke-width="2"/>
      <text x="12" y="20" text-anchor="middle" font-size="8" fill="#2c3e50">输入</text>
      
      <rect x="35" y="5" width="20" height="20" fill="#d5e8f7" stroke="#3498db" stroke-width="1"/>
      <text x="45" y="16" text-anchor="middle" font-size="7" fill="#2c3e50">Conv</text>
      
      <rect x="60" y="8" width="15" height="14" fill="#b3d9f2" stroke="#3498db" stroke-width="1"/>
      <text x="67" y="17" text-anchor="middle" font-size="7" fill="#2c3e50">Pool</text>
      
      <rect x="80" y="6" width="18" height="18" fill="#d5e8f7" stroke="#3498db" stroke-width="1"/>
      <text x="89" y="16" text-anchor="middle" font-size="7" fill="#2c3e50">Conv</text>
      
      <rect x="105" y="10" width="25" height="10" fill="#7bb3e8" stroke="#3498db" stroke-width="1"/>
      <text x="117" y="16" text-anchor="middle" font-size="7" fill="#2c3e50">FC</text>
      
      <rect x="135" y="12" width="15" height="6" fill="#5dade2" stroke="#3498db" stroke-width="1"/>
      
      <!-- 连接线 -->
      <g stroke="#95a5a6" stroke-width="1">
        <line x1="25" y1="15" x2="35" y2="15"/>
        <line x1="55" y1="15" x2="60" y2="15"/>
        <line x1="75" y1="15" x2="80" y2="15"/>
        <line x1="98" y1="15" x2="105" y2="15"/>
        <line x1="130" y1="15" x2="135" y2="15"/>
      </g>
    </g>
    
    <!-- 关键创新 -->
    <text x="0" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#3498db">奠定CNN基础</text>
  </g>
  
  <!-- AlexNet (2012) -->
  <g transform="translate(350, 60)">
    <circle cx="0" cy="20" r="10" fill="#e74c3c"/>
    <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">2012</text>
    
    <g transform="translate(-90, 80)">
      <text x="90" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">AlexNet</text>
      
      <!-- 更深的网络 -->
      <rect x="0" y="0" width="25" height="35" fill="#fdeaea" stroke="#e74c3c" stroke-width="2"/>
      <text x="12" y="20" text-anchor="middle" font-size="8" fill="#2c3e50">输入</text>
      
      <rect x="30" y="2" width="20" height="31" fill="#fcdddd" stroke="#e74c3c" stroke-width="1"/>
      <text x="40" y="19" text-anchor="middle" font-size="7" fill="#2c3e50">Conv1</text>
      
      <rect x="55" y="4" width="18" height="27" fill="#fbd0d0" stroke="#e74c3c" stroke-width="1"/>
      <text x="64" y="19" text-anchor="middle" font-size="7" fill="#2c3e50">Conv2</text>
      
      <rect x="78" y="6" width="16" height="23" fill="#f9c3c3" stroke="#e74c3c" stroke-width="1"/>
      <text x="86" y="19" text-anchor="middle" font-size="7" fill="#2c3e50">Conv3</text>
      
      <rect x="99" y="8" width="14" height="19" fill="#f8b6b6" stroke="#e74c3c" stroke-width="1"/>
      <text x="106" y="19" text-anchor="middle" font-size="7" fill="#2c3e50">Conv4</text>
      
      <rect x="118" y="10" width="25" height="15" fill="#f5a3a3" stroke="#e74c3c" stroke-width="1"/>
      <text x="130" y="19" text-anchor="middle" font-size="7" fill="#2c3e50">FC</text>
      
      <rect x="148" y="12" width="12" height="11" fill="#f29090" stroke="#e74c3c" stroke-width="1"/>
      
      <!-- 连接线 -->
      <g stroke="#95a5a6" stroke-width="1">
        <line x1="25" y1="17" x2="30" y2="17"/>
        <line x1="50" y1="17" x2="55" y2="17"/>
        <line x1="73" y1="17" x2="78" y2="17"/>
        <line x1="94" y1="17" x2="99" y2="17"/>
        <line x1="113" y1="17" x2="118" y2="17"/>
        <line x1="143" y1="17" x2="148" y2="17"/>
      </g>
    </g>
    
    <text x="0" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">ReLU + Dropout</text>
  </g>
  
  <!-- VGG (2014) -->
  <g transform="translate(550, 60)">
    <circle cx="0" cy="20" r="10" fill="#27ae60"/>
    <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">2014</text>
    
    <g transform="translate(-90, 80)">
      <text x="90" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">VGG-16</text>
      
      <!-- 统一3x3卷积 -->
      <rect x="0" y="0" width="25" height="30" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
      <text x="12" y="18" text-anchor="middle" font-size="8" fill="#2c3e50">输入</text>
      
      <!-- 多个相同的3x3卷积块 -->
      <g>
        <rect x="30" y="1" width="10" height="28" fill="#d5f4e6" stroke="#27ae60" stroke-width="1"/>
        <text x="35" y="17" text-anchor="middle" font-size="6" fill="#2c3e50">3×3</text>
        
        <rect x="43" y="2" width="10" height="26" fill="#c0efdb" stroke="#27ae60" stroke-width="1"/>
        <text x="48" y="17" text-anchor="middle" font-size="6" fill="#2c3e50">3×3</text>
        
        <rect x="56" y="3" width="10" height="24" fill="#abead0" stroke="#27ae60" stroke-width="1"/>
        <text x="61" y="17" text-anchor="middle" font-size="6" fill="#2c3e50">3×3</text>
        
        <rect x="69" y="4" width="10" height="22" fill="#96e5c5" stroke="#27ae60" stroke-width="1"/>
        <text x="74" y="17" text-anchor="middle" font-size="6" fill="#2c3e50">3×3</text>
        
        <rect x="82" y="5" width="10" height="20" fill="#81e0ba" stroke="#27ae60" stroke-width="1"/>
        <text x="87" y="17" text-anchor="middle" font-size="6" fill="#2c3e50">3×3</text>
        
        <rect x="95" y="6" width="10" height="18" fill="#6cdbaf" stroke="#27ae60" stroke-width="1"/>
        <text x="100" y="17" text-anchor="middle" font-size="6" fill="#2c3e50">3×3</text>
        
        <rect x="108" y="8" width="30" height="14" fill="#57d6a4" stroke="#27ae60" stroke-width="1"/>
        <text x="123" y="17" text-anchor="middle" font-size="6" fill="#2c3e50">FC</text>
        
        <rect x="143" y="10" width="15" height="10" fill="#42d199" stroke="#27ae60" stroke-width="1"/>
      </g>
    </g>
    
    <text x="0" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">小卷积核 + 深网络</text>
  </g>
  
  <!-- ResNet (2015) -->
  <g transform="translate(750, 60)">
    <circle cx="0" cy="20" r="10" fill="#8e44ad"/>
    <text x="0" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">2015</text>
    
    <g transform="translate(-90, 80)">
      <text x="90" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#8e44ad">ResNet-50</text>
      
      <!-- 残差连接示意 -->
      <rect x="20" y="0" width="15" height="25" fill="#f4f0ff" stroke="#8e44ad" stroke-width="2"/>
      <text x="27" y="15" text-anchor="middle" font-size="7" fill="#2c3e50">Conv</text>
      
      <rect x="40" y="3" width="15" height="19" fill="#ede4ff" stroke="#8e44ad" stroke-width="1"/>
      <text x="47" y="15" text-anchor="middle" font-size="7" fill="#2c3e50">Conv</text>
      
      <!-- 残差连接弧线 -->
      <path d="M 15 8 Q 10 -5 60 -5 Q 70 -5 70 8 L 70 18" stroke="#8e44ad" stroke-width="3" fill="none"/>
      <circle cx="70" cy="18" r="3" fill="#8e44ad"/>
      
      <!-- 后续块 -->
      <rect x="80" y="5" width="12" height="15" fill="#e8d9ff" stroke="#8e44ad" stroke-width="1"/>
      <text x="86" y="15" text-anchor="middle" font-size="6" fill="#2c3e50">Res</text>
      
      <rect x="95" y="6" width="12" height="13" fill="#dcc9ff" stroke="#8e44ad" stroke-width="1"/>
      <text x="101" y="15" text-anchor="middle" font-size="6" fill="#2c3e50">Res</text>
      
      <rect x="110" y="8" width="25" height="9" fill="#d0b9ff" stroke="#8e44ad" stroke-width="1"/>
      <text x="122" y="15" text-anchor="middle" font-size="6" fill="#2c3e50">FC</text>
      
      <rect x="140" y="10" width="15" height="5" fill="#c4a9ff" stroke="#8e44ad" stroke-width="1"/>
      
      <text x="45" y="40" text-anchor="middle" font-size="10" fill="#8e44ad">跳跃连接</text>
    </g>
    
    <text x="0" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e44ad">残差连接</text>
  </g>
  
  <!-- 性能趋势 -->
  <g transform="translate(200, 200)">
    <text x="300" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">准确率提升趋势</text>
    
    <!-- 简化的性能曲线 -->
    <g transform="translate(0, 30)">
      <!-- 坐标轴 -->
      <line x1="50" y1="150" x2="550" y2="150" stroke="#34495e" stroke-width="2"/>
      <line x1="50" y1="30" x2="50" y2="150" stroke="#34495e" stroke-width="2"/>
      
      <!-- Y轴标签 -->
      <text x="40" y="40" text-anchor="end" font-size="10" fill="#2c3e50">95%</text>
      <text x="40" y="80" text-anchor="end" font-size="10" fill="#2c3e50">85%</text>
      <text x="40" y="120" text-anchor="end" font-size="10" fill="#2c3e50">75%</text>
      <text x="40" y="160" text-anchor="end" font-size="10" fill="#2c3e50">65%</text>
      
      <!-- 数据点 -->
      <circle cx="125" cy="130" r="6" fill="#3498db"/>
      <text x="125" y="170" text-anchor="middle" font-size="10" fill="#3498db">LeNet</text>
      
      <circle cx="225" cy="110" r="6" fill="#e74c3c"/>
      <text x="225" y="170" text-anchor="middle" font-size="10" fill="#e74c3c">AlexNet</text>
      
      <circle cx="325" cy="90" r="6" fill="#27ae60"/>
      <text x="325" y="170" text-anchor="middle" font-size="10" fill="#27ae60">VGG</text>
      
      <circle cx="425" cy="50" r="6" fill="#8e44ad"/>
      <text x="425" y="170" text-anchor="middle" font-size="10" fill="#8e44ad">ResNet</text>
      
      <!-- 连接线 -->
      <path d="M 125 130 L 225 110 L 325 90 L 425 50" stroke="#2c3e50" stroke-width="3" fill="none"/>
      
      <!-- 人类水平线 -->
      <line x1="50" y1="55" x2="550" y2="55" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="560" y="60" font-size="10" fill="#e67e22">人类水平</text>
    </g>
  </g>
  
  <!-- 发展总结 -->
  <g transform="translate(200, 450)">
    <text x="300" y="0" text-anchor="middle" font-size="16" fill="#2c3e50">
      <tspan font-weight="bold">发展趋势：</tspan>
      网络越来越深，性能不断提升，逐步接近甚至超越人类水平
    </text>
  </g>
</svg>