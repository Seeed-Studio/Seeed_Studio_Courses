<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="760" height="400" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">池化操作对比：最大池化 vs 平均池化</text>
  
  <!-- 输入特征图 -->
  <g transform="translate(50, 80)">
    <text x="60" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#34495e">输入 (4×4)</text>
    
    <!-- 网格 -->
    <rect x="0" y="0" width="120" height="120" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    <g stroke="#7f8c8d" stroke-width="1">
      <line x1="30" y1="0" x2="30" y2="120"/>
      <line x1="60" y1="0" x2="60" y2="120"/>
      <line x1="90" y1="0" x2="90" y2="120"/>
      <line x1="0" y1="30" x2="120" y2="30"/>
      <line x1="0" y1="60" x2="120" y2="60"/>
      <line x1="0" y1="90" x2="120" y2="90"/>
    </g>
    
    <!-- 输入数值 -->
    <g font-size="16" text-anchor="middle" fill="#2c3e50" font-weight="bold">
      <text x="15" y="20">2</text><text x="45" y="20">8</text><text x="75" y="20">1</text><text x="105" y="20">6</text>
      <text x="15" y="50">3</text><text x="45" y="50">9</text><text x="75" y="50">5</text><text x="105" y="50">2</text>
      <text x="15" y="80">7</text><text x="45" y="80">1</text><text x="75" y="80">4</text><text x="105" y="80">8</text>
      <text x="15" y="110">6</text><text x="45" y="110">3</text><text x="75" y="110">0</text><text x="105" y="110">9</text>
    </g>
    
    <!-- 池化窗口划分 -->
    <g stroke="#3498db" stroke-width="3" fill="none">
      <rect x="0" y="0" width="60" height="60"/>
      <rect x="60" y="0" width="60" height="60"/>
      <rect x="0" y="60" width="60" height="60"/>
      <rect x="60" y="60" width="60" height="60"/>
    </g>
    
    <text x="60" y="145" text-anchor="middle" font-size="12" fill="#3498db">2×2池化窗口</text>
  </g>
  
  <!-- 最大池化 -->
  <g transform="translate(250, 80)">
    <text x="80" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#e74c3c">最大池化</text>
    
    <!-- 计算过程简化 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="160" height="80" fill="#fff5f5" stroke="#e74c3c" stroke-width="2" rx="5"/>
      
      <!-- 四个窗口的最大值计算 -->
      <g font-size="14" fill="#2c3e50">
        <text x="10" y="20" font-weight="bold">窗口1: [2,8,3,9] → 9</text>
        <text x="10" y="35" font-weight="bold">窗口2: [1,6,5,2] → 6</text>
        <text x="10" y="50" font-weight="bold">窗口3: [7,1,6,3] → 7</text>
        <text x="10" y="65" font-weight="bold">窗口4: [4,8,0,9] → 9</text>
      </g>
    </g>
    
    <!-- 输出结果 -->
    <g transform="translate(40, 120)">
      <text x="40" y="-5" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">输出 (2×2)</text>
      <rect x="0" y="0" width="80" height="80" fill="#fff5f5" stroke="#e74c3c" stroke-width="3"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#e74c3c" stroke-width="1"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#e74c3c" stroke-width="1"/>
      
      <g font-size="18" text-anchor="middle" fill="#e74c3c" font-weight="bold">
        <text x="20" y="25">9</text><text x="60" y="25">6</text>
        <text x="20" y="65">7</text><text x="60" y="65">9</text>
      </g>
    </g>
    
    <text x="80" y="230" text-anchor="middle" font-size="12" fill="#e74c3c">保留最强特征</text>
  </g>
  
  <!-- 平均池化 -->
  <g transform="translate(500, 80)">
    <text x="100" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">平均池化</text>
    
    <!-- 计算过程简化 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="200" height="80" fill="#f0fff4" stroke="#27ae60" stroke-width="2" rx="5"/>
      
      <!-- 四个窗口的平均值计算 -->
      <g font-size="14" fill="#2c3e50">
        <text x="10" y="20" font-weight="bold">窗口1: (2+8+3+9)/4 = 5.5</text>
        <text x="10" y="35" font-weight="bold">窗口2: (1+6+5+2)/4 = 3.5</text>
        <text x="10" y="50" font-weight="bold">窗口3: (7+1+6+3)/4 = 4.25</text>
        <text x="10" y="65" font-weight="bold">窗口4: (4+8+0+9)/4 = 5.25</text>
      </g>
    </g>
    
    <!-- 输出结果 -->
    <g transform="translate(60, 120)">
      <text x="40" y="-5" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">输出 (2×2)</text>
      <rect x="0" y="0" width="80" height="80" fill="#f0fff4" stroke="#27ae60" stroke-width="3"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#27ae60" stroke-width="1"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#27ae60" stroke-width="1"/>
      
      <g font-size="16" text-anchor="middle" fill="#27ae60" font-weight="bold">
        <text x="20" y="25">5.5</text><text x="60" y="25">3.5</text>
        <text x="20" y="65">4.3</text><text x="60" y="65">5.3</text>
      </g>
    </g>
    
    <text x="100" y="230" text-anchor="middle" font-size="12" fill="#27ae60">平滑特征表示</text>
  </g>
  
  <!-- 对比总结 -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="600" height="60" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="300" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">应用场景</text>
    
    <g transform="translate(0, 30)">
      <text x="150" y="15" text-anchor="middle" font-size="14" fill="#e74c3c">
        <tspan font-weight="bold">最大池化：</tspan>边缘检测、目标识别
      </text>
      <text x="450" y="15" text-anchor="middle" font-size="14" fill="#27ae60">
        <tspan font-weight="bold">平均池化：</tspan>背景分析、特征降维
      </text>
    </g>
  </g>
</svg>