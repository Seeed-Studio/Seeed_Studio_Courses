<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">全连接网络处理图像的局限性</text>
  
  <!-- 原始图像 -->
  <g transform="translate(80, 80)">
    <text x="60" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#34495e">原始图像</text>
    <!-- 图像网格 -->
    <rect x="0" y="0" width="120" height="120" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
    
    <!-- 网格线 -->
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#bdc3c7" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="120" height="120" fill="url(#grid)"/>
    
    <!-- 相邻像素示意 -->
    <rect x="40" y="40" width="20" height="20" fill="#3498db" opacity="0.8"/>
    <rect x="60" y="40" width="20" height="20" fill="#e74c3c" opacity="0.8"/>
    <rect x="40" y="60" width="20" height="20" fill="#27ae60" opacity="0.8"/>
    <rect x="60" y="60" width="20" height="20" fill="#f39c12" opacity="0.8"/>
    
    <text x="60" y="150" text-anchor="middle" font-size="12" fill="#7f8c8d">相邻像素有关联</text>
  </g>
  
  <!-- 箭头1 -->
  <path d="M 220 140 L 280 140" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead)"/>
  <text x="250" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">展平</text>
  
  <!-- 展平后的向量 -->
  <g transform="translate(300, 100)">
    <text x="100" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#34495e">一维向量</text>
    
    <!-- 展平的向量 -->
    <rect x="0" y="20" width="200" height="30" fill="#f8f9fa" stroke="#e67e22" stroke-width="2"/>
    
    <!-- 分段显示相邻像素被分散 -->
    <rect x="10" y="25" width="20" height="20" fill="#3498db" opacity="0.8"/>
    <rect x="50" y="25" width="20" height="20" fill="#e74c3c" opacity="0.8"/>
    <rect x="90" y="25" width="20" height="20" fill="#27ae60" opacity="0.8"/>
    <rect x="170" y="25" width="20" height="20" fill="#f39c12" opacity="0.8"/>
    
    <!-- 分散线条 -->
    <path d="M 20 50 Q 35 70 50 50" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
    <path d="M 60 50 Q 75 70 90 50" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
    
    <text x="100" y="80" text-anchor="middle" font-size="12" fill="#e74c3c">相邻关系丢失</text>
  </g>
  
  <!-- 箭头2 -->
  <path d="M 520 140 L 580 140" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <!-- 全连接网络 -->
  <g transform="translate(600, 80)">
    <text x="80" y="-10" text-anchor="middle" font-size="16" font-weight="bold" fill="#34495e">全连接网络</text>
    
    <!-- 简化的网络图 -->
    <rect x="0" y="20" width="160" height="100" fill="#fff5f5" stroke="#e74c3c" stroke-width="2"/>
    
    <!-- 输入层节点 -->
    <g fill="#3498db">
      <circle cx="20" cy="40" r="4"/>
      <circle cx="20" cy="55" r="4"/>
      <circle cx="20" cy="70" r="4"/>
      <circle cx="20" cy="85" r="4"/>
      <circle cx="20" cy="100" r="4"/>
      <text x="20" y="115" text-anchor="middle" font-size="8" fill="#2c3e50">很多节点</text>
    </g>
    
    <!-- 连接线(密集) -->
    <g stroke="#95a5a6" stroke-width="1" opacity="0.6">
      <line x1="24" y1="40" x2="136" y2="60"/>
      <line x1="24" y1="55" x2="136" y2="60"/>
      <line x1="24" y1="70" x2="136" y2="60"/>
      <line x1="24" y1="85" x2="136" y2="70"/>
      <line x1="24" y1="100" x2="136" y2="70"/>
      <line x1="24" y1="40" x2="136" y2="80"/>
      <line x1="24" y1="55" x2="136" y2="80"/>
      <line x1="24" y1="70" x2="136" y2="80"/>
    </g>
    
    <!-- 输出层 -->
    <g fill="#27ae60">
      <circle cx="140" cy="60" r="4"/>
      <circle cx="140" cy="70" r="4"/>
      <circle cx="140" cy="80" r="4"/>
    </g>
    
    <text x="80" y="140" text-anchor="middle" font-size="12" fill="#e74c3c">参数过多</text>
  </g>
  
  <!-- 问题总结 -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="600" height="80" fill="#fff5f5" stroke="#e74c3c" stroke-width="2"/>
    <text x="20" y="25" font-size="16" font-weight="bold" fill="#e74c3c">主要问题</text>
    
    <g transform="translate(0, 40)">
      <circle cx="30" cy="8" r="4" fill="#e74c3c"/>
      <text x="45" y="12" font-size="14" fill="#2c3e50">空间信息丢失：相邻像素关系被破坏</text>
      
      <circle cx="330" cy="8" r="4" fill="#e74c3c"/>
      <text x="345" y="12" font-size="14" fill="#2c3e50">参数数量庞大：容易过拟合</text>
    </g>
  </g>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>