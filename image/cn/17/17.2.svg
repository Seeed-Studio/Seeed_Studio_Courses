<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">人类视觉系统 vs CNN：层次化特征学习</text>
  
  <!-- 人类视觉系统 -->
  <g transform="translate(50, 80)">
    <text x="150" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#3498db">人类视觉系统</text>
    
    <!-- 输入图像 -->
    <g transform="translate(120, 30)">
      <rect x="0" y="0" width="60" height="50" fill="#ecf0f1" stroke="#3498db" stroke-width="2"/>
      <!-- 简单的图像内容 -->
      <circle cx="20" cy="20" r="3" fill="#2c3e50"/>
      <circle cx="40" cy="20" r="3" fill="#2c3e50"/>
      <path d="M 15 35 Q 30 45 45 35" stroke="#2c3e50" stroke-width="2" fill="none"/>
      <text x="30" y="65" text-anchor="middle" font-size="12" fill="#34495e">视觉输入</text>
    </g>
    
    <!-- 层次化处理 -->
    <g transform="translate(0, 120)">
      <!-- 第1层：边缘检测 -->
      <rect x="50" y="0" width="200" height="40" fill="#e8f4fd" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="80" y="15" font-size="14" fill="#2c3e50">边缘</text>
      <text x="80" y="30" font-size="14" fill="#2c3e50">线条</text>
      <!-- 简单的边缘示意 -->
      <g stroke="#e74c3c" stroke-width="2">
        <line x1="150" y1="10" x2="170" y2="10"/>
        <line x1="180" y1="10" x2="180" y2="30"/>
        <line x1="190" y1="20" x2="210" y2="20"/>
      </g>
      
      <!-- 箭头 -->
      <path d="M 150 50 L 150 80" stroke="#3498db" stroke-width="3" marker-end="url(#bluearrow)"/>
      
      <!-- 第2层：形状 -->
      <rect x="70" y="90" width="160" height="40" fill="#d5e8f7" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="100" y="105" font-size="14" fill="#2c3e50">形状</text>
      <text x="100" y="120" font-size="14" fill="#2c3e50">纹理</text>
      <!-- 形状示意 -->
      <circle cx="180" cy="110" r="8" fill="none" stroke="#27ae60" stroke-width="2"/>
      <rect x="195" y="102" width="15" height="15" fill="none" stroke="#f39c12" stroke-width="2"/>
      
      <!-- 箭头 -->
      <path d="M 150 140 L 150 170" stroke="#3498db" stroke-width="3" marker-end="url(#bluearrow)"/>
      
      <!-- 第3层：物体 -->
      <rect x="90" y="180" width="120" height="40" fill="#b3d9f2" stroke="#3498db" stroke-width="2" rx="5"/>
      <text x="150" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">猫</text>
    </g>
  </g>
  
  <!-- 对比箭头 -->
  <g transform="translate(350, 250)">
    <path d="M 0 0 L 100 0" stroke="#2c3e50" stroke-width="4" stroke-dasharray="10,5"/>
    <text x="50" y="-10" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">相似过程</text>
  </g>
  
  <!-- CNN -->
  <g transform="translate(500, 80)">
    <text x="150" y="0" text-anchor="middle" font-size="18" font-weight="bold" fill="#e74c3c">卷积神经网络</text>
    
    <!-- 输入图像 -->
    <g transform="translate(120, 30)">
      <rect x="0" y="0" width="60" height="50" fill="#ecf0f1" stroke="#e74c3c" stroke-width="2"/>
      <!-- 相同的图像内容 -->
      <circle cx="20" cy="20" r="3" fill="#2c3e50"/>
      <circle cx="40" cy="20" r="3" fill="#2c3e50"/>
      <path d="M 15 35 Q 30 45 45 35" stroke="#2c3e50" stroke-width="2" fill="none"/>
      <text x="30" y="65" text-anchor="middle" font-size="12" fill="#34495e">图像输入</text>
    </g>
    
    <!-- 层次化处理 -->
    <g transform="translate(0, 120)">
      <!-- 卷积层1 -->
      <rect x="50" y="0" width="200" height="40" fill="#fdeaea" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="80" y="15" font-size="14" fill="#2c3e50">卷积层1</text>
      <text x="80" y="30" font-size="14" fill="#2c3e50">边缘检测</text>
      <!-- 特征图示意 -->
      <g>
        <rect x="150" y="8" width="12" height="12" fill="#fff2cc" stroke="#f39c12" stroke-width="1"/>
        <rect x="165" y="8" width="12" height="12" fill="#ffe6cc" stroke="#e67e22" stroke-width="1"/>
        <rect x="180" y="8" width="12" height="12" fill="#ffcccc" stroke="#e74c3c" stroke-width="1"/>
        <rect x="150" y="22" width="12" height="12" fill="#e6ccff" stroke="#8e44ad" stroke-width="1"/>
        <rect x="165" y="22" width="12" height="12" fill="#ccffcc" stroke="#27ae60" stroke-width="1"/>
        <rect x="180" y="22" width="12" height="12" fill="#ccf2ff" stroke="#3498db" stroke-width="1"/>
      </g>
      
      <!-- 箭头 -->
      <path d="M 150 50 L 150 80" stroke="#e74c3c" stroke-width="3" marker-end="url(#redarrow)"/>
      
      <!-- 卷积层2 -->
      <rect x="70" y="90" width="160" height="40" fill="#f0d7de" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="100" y="105" font-size="14" fill="#2c3e50">卷积层2</text>
      <text x="100" y="120" font-size="14" fill="#2c3e50">复杂特征</text>
      <!-- 更复杂的特征图 -->
      <g>
        <rect x="180" y="98" width="10" height="10" fill="#d4edda" stroke="#27ae60" stroke-width="1"/>
        <rect x="195" y="98" width="10" height="10" fill="#cce5ff" stroke="#007bff" stroke-width="1"/>
        <rect x="180" y="112" width="10" height="10" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
        <rect x="195" y="112" width="10" height="10" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
      </g>
      
      <!-- 箭头 -->
      <path d="M 150 140 L 150 170" stroke="#e74c3c" stroke-width="3" marker-end="url(#redarrow)"/>
      
      <!-- 全连接层 -->
      <rect x="90" y="180" width="120" height="40" fill="#d6b5c4" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <text x="150" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">猫: 95%</text>
    </g>
  </g>
  
  <!-- 关键概念 -->
  <g transform="translate(200, 450)">
    <rect x="0" y="0" width="400" height="40" fill="#f8f9fa" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="200" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">
      都是从简单特征逐步组合成复杂特征
    </text>
  </g>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="bluearrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3498db"/>
    </marker>
    <marker id="redarrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e74c3c"/>
    </marker>
  </defs>
</svg>